<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>店舗業務ノート</title>
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<header id="topbar">
  <div id="topbar-title">ホーム</div>
  <div id="topbar-actions">
    <button class="icon-btn" id="btn-summary" title="日次集計">📊</button>
    <button class="icon-btn" id="btn-settings" title="設定">⚙️</button>
  </div>
</header>

<main id="view"></main>

<div id="fab-wrap">
  <div id="fab-menu" class="hidden">
    <button class="fab-item" data-fab="todo">📝 TODO追加</button>
    <button class="fab-item" data-fab="customer">🙋 お客様対応開始</button>
    <button class="fab-item" data-fab="order">📦 客注追加</button>
  </div>
  <button id="fab-main">＋</button>
</div>

<nav id="bottomnav">
  <a href="#/home" data-route="home"><span class="nav-ico">🏠</span><span>ホーム</span></a>
  <a href="#/schedule" data-route="schedule"><span class="nav-ico">🕒</span><span>予定</span></a>
  <a href="#/todo" data-route="todo"><span class="nav-ico">✅</span><span>TODO</span></a>
  <a href="#/questions" data-route="questions"><span class="nav-ico">❓</span><span>質問</span></a>
  <a href="#/orders" data-route="orders"><span class="nav-ico">📦</span><span>客注</span></a>
</nav>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
